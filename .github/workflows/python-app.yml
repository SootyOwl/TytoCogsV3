# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Run Python Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v6
    - name: "Set up Python"
      uses: actions/setup-python@v5
      with:
        python-version-file: "pyproject.toml"
    - name: Install the project
      run: uv sync --locked --all-extras --dev
    - name: Check standalone TLDW dependency installation
      run: |
        uv run python - <<'PY'
        import json
        import subprocess
        import sys
        import tempfile
        from pathlib import Path

        requirements = json.loads(Path("tldw/info.json").read_text())["requirements"]
        with tempfile.TemporaryDirectory() as target:
            subprocess.run(
                [sys.executable, "-m", "pip", "install", "--upgrade", "--target", target, *requirements],
                check=True,
            )
            # Red imports typing_extensions before Downloader installs cog dependencies.
            # A fresh target must still import with that module already cached.
            subprocess.run(
                [sys.executable, "-c", "import sys, typing_extensions; sys.path.insert(0, sys.argv[1]); from tldw import TLDWatch", target],
                check=True,
            )
        PY
    - name: Test with pytest (no live services)
      run: uv run pytest -m "not live"
